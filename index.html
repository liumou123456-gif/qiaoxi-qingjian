<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>乔迁之喜 · 请柬</title>
<style>
:root{
  --red-deep:#7a0a0a;
  --red:#a91414;
  --red-bright:#c62828;
  --gold:#e8c06a;
  --gold-light:#f7e0a3;
  --gold-dark:#b8863b;
  --paper:#fff9ec;
  --ink:#5a1010;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;}
body{
  font-family:"KaiTi","STKaiti","楷体","FangSong","仿宋","Noto Serif SC",serif;
  color:var(--ink);
  overflow:hidden;
  background:
    radial-gradient(1200px 800px at 50% 18%, #c62828 0%, #9d1313 42%, #7a0a0a 78%, #5e0707 100%);
  -webkit-tap-highlight-color:transparent;
}
.bg-dots{
  position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.5;
  background-image:
    radial-gradient(circle at 20% 30%, rgba(247,224,163,.35) 0 2px, transparent 3px),
    radial-gradient(circle at 70% 15%, rgba(247,224,163,.3) 0 2px, transparent 3px),
    radial-gradient(circle at 85% 60%, rgba(247,224,163,.28) 0 2px, transparent 3px),
    radial-gradient(circle at 10% 75%, rgba(247,224,163,.32) 0 2px, transparent 3px),
    radial-gradient(circle at 45% 85%, rgba(247,224,163,.25) 0 2px, transparent 3px),
    radial-gradient(circle at 60% 40%, rgba(255,255,255,.14) 0 1.5px, transparent 2.5px);
  background-size:320px 320px,280px 280px,360px 360px,300px 300px,340px 340px,260px 260px;
}
.lantern{position:fixed;top:-12px;z-index:2;pointer-events:none;filter:drop-shadow(0 6px 14px rgba(0,0,0,.35));}
.lantern.left{left:6%;transform-origin:top center;animation:swing 5s ease-in-out infinite;}
.lantern.right{right:6%;transform-origin:top center;animation:swing 5.4s ease-in-out infinite reverse;}
@keyframes swing{0%,100%{transform:rotate(-4deg);}50%{transform:rotate(4deg);}}
.lantern .rope{width:2px;height:26px;background:var(--gold-dark);margin:0 auto;}
.lantern .cap{width:34px;height:8px;background:var(--gold-dark);margin:0 auto;border-radius:2px;}
.lantern .body{
  width:64px;height:74px;margin:0 auto;border-radius:50%;position:relative;
  background:radial-gradient(circle at 35% 30%, #ff5a5a, #d81e1e 60%, #8f0f0f);
  box-shadow:0 0 26px rgba(255,120,60,.55), inset 0 -6px 12px rgba(0,0,0,.25);
}
.lantern .body::before,.lantern .body::after{
  content:"";position:absolute;left:50%;transform:translateX(-50%);
  width:60%;height:5px;border-radius:50%;
  background:linear-gradient(90deg,transparent,var(--gold-light),transparent);
}
.lantern .body::before{top:12px;}
.lantern .body::after{bottom:12px;}
.lantern .tassel{width:2px;height:20px;background:var(--gold-dark);margin:0 auto;}
.lantern .tassel-tip{width:10px;height:14px;margin:0 auto;border-radius:0 0 50% 50%;background:var(--gold);}
.scene{position:relative;z-index:3;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;}

.envelope-wrap{position:relative;perspective:1400px;cursor:pointer;user-select:none;}
.envelope{
  position:relative;width:min(78vw,360px);height:min(54vw,250px);
  transition:transform .5s ease, opacity .5s ease;
}
.envelope .env-body{
  position:absolute;inset:0;border-radius:10px;
  background:linear-gradient(160deg,#c62828 0%,#a11212 55%,#8c0e0e 100%);
  box-shadow:0 18px 40px rgba(0,0,0,.45), inset 0 0 0 1px rgba(247,224,163,.25);
  overflow:hidden;
}
.envelope .env-body::before{
  content:"";position:absolute;inset:9px;border:1.5px solid rgba(232,192,106,.55);border-radius:7px;
}
.envelope .env-body::after{
  content:"";position:absolute;inset:0;opacity:.28;
  background:
    radial-gradient(circle at 15% 70%, rgba(247,224,163,.5) 0 1.5px, transparent 2.5px),
    radial-gradient(circle at 85% 30%, rgba(247,224,163,.45) 0 1.5px, transparent 2.5px),
    radial-gradient(circle at 55% 85%, rgba(247,224,163,.4) 0 1.5px, transparent 2.5px);
  background-size:70px 70px,90px 90px,110px 110px;
}
.envelope .flap{
  position:absolute;top:0;left:0;width:100%;height:56%;
  z-index:4;transform-origin:top center;transition:transform .7s cubic-bezier(.4,0,.2,1);
}
.envelope .flap .flap-inner{
  position:absolute;inset:0;border-radius:10px 10px 0 0;overflow:hidden;
  background:linear-gradient(160deg,#d63333 0%,#a91414 60%,#8c0e0e 100%);
  clip-path:polygon(0 0,100% 0,50% 100%);
  box-shadow:0 10px 22px rgba(0,0,0,.35);
}
.envelope .flap .flap-inner::after{
  content:"";position:absolute;inset:0;opacity:.3;
  background:radial-gradient(circle at 50% 30%, rgba(247,224,163,.35), transparent 60%);
}
.seal{
  position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);
  width:86px;height:86px;border-radius:50%;z-index:6;
  background:radial-gradient(circle at 35% 30%, #f7e0a3, #e8c06a 45%, #c28d3d 80%, #9c6b25);
  box-shadow:0 8px 18px rgba(0,0,0,.4), inset 0 0 0 3px rgba(255,248,225,.55), inset 0 -6px 12px rgba(122,70,10,.4);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  color:#7a0a0a;font-weight:700;transition:transform .7s ease, opacity .7s ease;
}
.seal .s1{font-size:28px;line-height:1;}
.seal .s2{font-size:11px;letter-spacing:3px;margin-top:3px;padding-left:3px;color:#8c1515;}
.hint{
  position:absolute;left:50%;bottom:-54px;transform:translateX(-50%);
  color:#f7e0a3;font-size:16px;letter-spacing:4px;white-space:nowrap;
  text-shadow:0 2px 8px rgba(0,0,0,.4);animation:breathe 2.2s ease-in-out infinite;
}
@keyframes breathe{0%,100%{opacity:.55;transform:translateX(-50%) translateY(0);}50%{opacity:1;transform:translateX(-50%) translateY(-5px);}}
.hint .arrow{display:inline-block;animation:arrow 1.6s ease-in-out infinite;}
@keyframes arrow{0%,100%{transform:translateY(0);}50%{transform:translateY(4px);}}

.scene.open .envelope{transform:translateY(-120%) scale(.9) rotateX(20deg);opacity:0;pointer-events:none;}
.scene.open .flap{transform:rotateX(-180deg);}
.scene.open .seal{transform:translate(-50%,-50%) scale(.2);opacity:0;}
.scene.open .hint{opacity:0;}

.card{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.82);
  width:min(92vw,460px);max-height:88vh;overflow-y:auto;
  background:var(--paper);
  border-radius:6px;
  box-shadow:0 30px 70px rgba(0,0,0,.55), 0 0 0 1px rgba(184,134,59,.35);
  opacity:0;pointer-events:none;visibility:hidden;
  transition:opacity .6s ease, transform .6s cubic-bezier(.2,.9,.3,1.2), visibility .6s;
  scrollbar-width:thin;scrollbar-color:#c9a15f transparent;
}
.card::-webkit-scrollbar{width:6px;}
.card::-webkit-scrollbar-thumb{background:#d4b06a;border-radius:3px;}
.scene.open .card{opacity:1;pointer-events:auto;visibility:visible;transform:translate(-50%,-50%) scale(1);}
.card-inner{position:relative;padding:30px 28px 34px;}
.card-frame{position:absolute;inset:10px;border:1.5px solid rgba(166,32,32,.5);border-radius:4px;pointer-events:none;}
.card-frame::before,.card-frame::after{
  content:"";position:absolute;width:22px;height:22px;border:2.5px solid var(--gold-dark);
}
.card-frame::before{top:-2px;left:-2px;border-right:none;border-bottom:none;border-top-left-radius:5px;}
.card-frame::after{bottom:-2px;right:-2px;border-left:none;border-top:none;border-bottom-right-radius:5px;}
.corner-tr,.corner-bl{position:absolute;width:22px;height:22px;border:2.5px solid var(--gold-dark);}
.corner-tr{top:8px;right:8px;border-left:none;border-bottom:none;border-top-right-radius:5px;}
.corner-bl{bottom:8px;left:8px;border-right:none;border-top:none;border-bottom-left-radius:5px;}
.card-head{text-align:center;position:relative;}
.ribbon{
  display:inline-block;font-size:12px;letter-spacing:6px;color:#fff;background:var(--red);
  padding:4px 16px;border-radius:2px;margin-bottom:16px;font-family:"FangSong","仿宋",serif;
}
.card-title{
  font-size:clamp(40px,11vw,56px);color:var(--red);letter-spacing:6px;line-height:1.15;
  font-family:"STXingkai","KaiTi","楷体",serif;text-shadow:0 2px 6px rgba(166,32,32,.18);
}
.card-sub{margin-top:8px;color:var(--gold-dark);font-size:15px;letter-spacing:5px;padding-left:5px;}
.divider{display:flex;align-items:center;justify-content:center;gap:12px;margin:20px 0 6px;color:var(--gold-dark);}
.divider::before,.divider::after{content:"";height:1px;width:56px;background:linear-gradient(90deg,transparent,var(--gold-dark));}
.divider::after{background:linear-gradient(90deg,var(--gold-dark),transparent);}
.divider .diamond{width:8px;height:8px;background:var(--gold-dark);transform:rotate(45deg);}
.greeting{text-align:center;font-size:16px;line-height:2;color:#6b2a2a;margin-top:10px;}
.greeting b{color:var(--red);}
.details{margin:18px auto 0;max-width:360px;}
.detail{
  display:flex;align-items:flex-start;gap:12px;padding:12px 14px;margin-bottom:12px;
  background:rgba(166,32,32,.055);border:1px solid rgba(166,32,32,.16);border-left:4px solid var(--red);border-radius:4px;
}
.detail .ico{font-size:22px;line-height:1.3;}
.detail .lab{font-size:13px;color:#a26a1e;letter-spacing:2px;margin-bottom:3px;}
.detail .val{font-size:17px;color:#5a1010;line-height:1.5;letter-spacing:1px;}
.date-big{font-size:22px;font-family:"STXingkai","KaiTi","楷体",serif;color:var(--red);letter-spacing:2px;}
.actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:20px;}
.btn{
  cursor:pointer;border:none;font-family:inherit;letter-spacing:2px;padding-left:2px;
  font-size:15px;padding:10px 16px;border-radius:30px;transition:transform .15s ease, box-shadow .15s ease;
}
.btn:active{transform:scale(.96);}
.btn-gold{background:linear-gradient(180deg,#f7e0a3,#e2b85f);color:#7a0a0a;box-shadow:0 6px 14px rgba(184,134,59,.4);}
.btn-red{background:linear-gradient(180deg,#d63333,#a91414);color:#fff;box-shadow:0 6px 14px rgba(166,32,32,.4);}
.btn-ghost{background:transparent;color:#a91414;border:1px solid rgba(166,32,32,.5);}
.card-foot{text-align:center;margin-top:22px;color:#8c6a2f;font-size:14px;letter-spacing:3px;}
.card-foot .host{font-size:18px;color:var(--red);letter-spacing:4px;margin-bottom:6px;}
.seal-red{
  display:inline-flex;align-items:center;justify-content:center;flex-direction:column;
  margin-top:12px;width:58px;height:58px;line-height:1.2;
  border-radius:8px;background:var(--red);color:#fff;font-size:13px;letter-spacing:1px;
  transform:rotate(-6deg);box-shadow:0 4px 10px rgba(166,32,32,.4);
}
.close-btn{
  position:absolute;top:12px;right:12px;z-index:20;width:34px;height:34px;border-radius:50%;
  border:1px solid rgba(166,32,32,.4);background:rgba(255,249,236,.9);color:var(--red);
  font-size:18px;cursor:pointer;line-height:1;
}
.music-btn{
  position:fixed;top:14px;left:14px;z-index:30;width:42px;height:42px;border-radius:50%;
  background:rgba(255,249,236,.14);border:1px solid rgba(247,224,163,.5);color:#f7e0a3;
  font-size:20px;cursor:pointer;backdrop-filter:blur(2px);transition:background .2s;
}
.music-btn.on{background:rgba(232,192,106,.9);color:#7a0a0a;}
#confetti{position:fixed;inset:0;z-index:25;pointer-events:none;}
@media (max-height:640px){
  .card-title{font-size:38px;}
  .card-inner{padding:22px 20px 26px;}
}
</style>
</head>
<body>
<div class="bg-dots"></div>
<div class="lantern left"><div class="rope"></div><div class="cap"></div><div class="body"></div><div class="tassel"></div><div class="tassel-tip"></div></div>
<div class="lantern right"><div class="rope"></div><div class="cap"></div><div class="body"></div><div class="tassel"></div><div class="tassel-tip"></div></div>
<canvas id="confetti"></canvas>

<button class="music-btn" id="musicBtn" title="背景音乐" aria-label="背景音乐">♪</button>

<div class="scene" id="scene">
  <div class="envelope-wrap" id="envelopeWrap" role="button" tabindex="0" aria-label="打开请柬">
    <div class="envelope" id="envelope">
      <div class="env-body"></div>
      <div class="flap"><div class="flap-inner"></div></div>
      <div class="seal"><span class="s1">请柬</span><span class="s2">乔迁之喜</span></div>
    </div>
    <div class="hint">点 击 开 启 &nbsp;<span class="arrow">﹀</span></div>
  </div>

  <div class="card" id="card">
    <button class="close-btn" id="closeBtn" aria-label="返回">✕</button>
    <div class="card-inner">
      <div class="card-frame"></div>
      <div class="corner-tr"></div>
      <div class="corner-bl"></div>
      <div class="card-head">
        <span class="ribbon">新 居 誌 庆</span>
        <div class="card-title">乔迁之喜</div>
        <div class="card-sub">誠 邀 蒞 臨</div>
      </div>
      <div class="divider"><span class="diamond"></span></div>
      <div class="greeting" id="greeting"></div>
      <div class="details">
        <div class="detail">
          <div class="ico">📅</div>
          <div>
            <div class="lab">日 期 · DATE</div>
            <div class="val date-big" id="valDate"></div>
            <div class="val" id="valLunar"></div>
          </div>
        </div>
        <div class="detail">
          <div class="ico">📍</div>
          <div>
            <div class="lab">地 址 · ADDRESS</div>
            <div class="val" id="valAddr"></div>
          </div>
        </div>
      </div>
      <div class="actions">
        <button class="btn btn-gold" id="copyBtn">复制地址</button>
        <button class="btn btn-red" id="navBtn">一键导航</button>
        <button class="btn btn-ghost" id="calBtn">添加到日历</button>
      </div>
      <div class="card-foot">
        <div class="host" id="hostLine"></div>
        <div>略备薄酒 · 敬备入伙之宴</div>
        <div>恭候 大驾光临</div>
        <span class="seal-red">乔迁<br>誌庆</span>
      </div>
    </div>
  </div>
</div>

<script>
var CONFIG = {
  host: "刘泽彬、肖才华",
  greeting: "谨择吉日，迁居新宅。<br>略备薄酒，敬设入伙之宴，<b>诚邀您莅临同贺。</b>",
  solar: "2026年11月1日（星期日）",
  lunar: "农历 丙午年 九月廿三",
  address: "东莞市樟木头镇帝豪花园三期雍德阁1A",
  eventTitle: "乔迁之喜 · 入伙宴"
};

(function(){
  var scene = document.getElementById('scene');
  var wrap = document.getElementById('envelopeWrap');
  var closeBtn = document.getElementById('closeBtn');

  document.getElementById('greeting').innerHTML = CONFIG.greeting;
  document.getElementById('valDate').textContent = CONFIG.solar;
  document.getElementById('valLunar').textContent = CONFIG.lunar;
  document.getElementById('valAddr').textContent = CONFIG.address;
  document.getElementById('hostLine').textContent = CONFIG.host ? (CONFIG.host + ' 敬邀') : '';

  function openCard(){
    if(scene.classList.contains('open')) return;
    scene.classList.add('open');
    burstConfetti();
  }
  function closeCard(){
    if(!scene.classList.contains('open')) return;
    scene.classList.remove('open');
  }
  wrap.addEventListener('click', openCard);
  if(location.hash === '#open'){ setTimeout(openCard, 500); }
  wrap.addEventListener('keydown', function(e){
    if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); openCard(); }
  });
  closeBtn.addEventListener('click', function(e){ e.stopPropagation(); closeCard(); });

  document.getElementById('copyBtn').addEventListener('click', function(){
    var txt = CONFIG.address;
    function done(){ toast('地址已复制'); }
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(done, function(){ fallbackCopy(txt); done(); });
    } else { fallbackCopy(txt); done(); }
  });
  function fallbackCopy(txt){
    var ta = document.createElement('textarea');
    ta.value = txt; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); }catch(e){}
    document.body.removeChild(ta);
  }

  document.getElementById('navBtn').addEventListener('click', function(){
    var q = encodeURIComponent(CONFIG.address);
    location.href = 'https://uri.amap.com/search?keyword=' + q;
  });

  document.getElementById('calBtn').addEventListener('click', function(){
    var ics = [
      'BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//QiaoQian//CN','CALSCALE:GREGORIAN',
      'BEGIN:VEVENT',
      'UID:' + Date.now() + '@qiaoqian',
      'DTSTAMP:20261019T000000Z',
      'DTSTART;VALUE=DATE:20261101',
      'DTEND;VALUE=DATE:20261102',
      'SUMMARY:' + CONFIG.eventTitle,
      'LOCATION:' + CONFIG.address,
      'DESCRIPTION:' + CONFIG.eventTitle + '（全天）',
      'END:VEVENT','END:VCALENDAR'
    ].join('\r\n');
    var blob = new Blob(['\ufeff' + ics], {type:'text/calendar;charset=utf-8'});
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = '乔迁喜宴.ics';
    document.body.appendChild(a); a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(a.href); }, 2000);
    toast('已生成日历（全天），请查收下载');
  });

  var toastEl;
  function toast(msg){
    if(toastEl){ toastEl.remove(); }
    toastEl = document.createElement('div');
    toastEl.textContent = msg;
    toastEl.style.cssText = 'position:fixed;left:50%;bottom:44px;transform:translateX(-50%);z-index:60;'+
      'background:rgba(90,16,16,.92);color:#f7e0a3;padding:10px 22px;border-radius:30px;'+
      'font-size:15px;letter-spacing:2px;box-shadow:0 8px 20px rgba(0,0,0,.35);transition:opacity .4s;';
    document.body.appendChild(toastEl);
    setTimeout(function(){ toastEl.style.opacity='0'; setTimeout(function(){ toastEl.remove(); },400); }, 1800);
  }

  var canvas = document.getElementById('confetti');
  var ctx = canvas.getContext('2d');
  var parts = []; var rafId = null;
  function sizeCanvas(){ canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
  sizeCanvas(); window.addEventListener('resize', sizeCanvas);
  var COLORS = ['#f7e0a3','#e8c06a','#d63333','#ff8a65','#fff3cf','#b8863b'];
  function burstConfetti(){
    var n = 130;
    for(var i=0;i<n;i++){
      parts.push({
        x: window.innerWidth/2 + (Math.random()-0.5)*160,
        y: window.innerHeight*0.42,
        vx: (Math.random()-0.5)*11,
        vy: -(Math.random()*9+4),
        g: 0.28 + Math.random()*0.12,
        s: 5 + Math.random()*7,
        r: Math.random()*Math.PI,
        vr: (Math.random()-0.5)*0.3,
        c: COLORS[(Math.random()*COLORS.length)|0],
        life: 1
      });
    }
    if(rafId) cancelAnimationFrame(rafId);
    tick();
  }
  function tick(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    for(var i=parts.length-1;i>=0;i--){
      var p = parts[i];
      p.vy += p.g; p.x += p.vx; p.y += p.vy; p.r += p.vr; p.life -= 0.006;
      if(p.life<=0 || p.y > canvas.height + 30){ parts.splice(i,1); continue; }
      ctx.save();
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.translate(p.x,p.y); ctx.rotate(p.r);
      ctx.fillStyle = p.c;
      ctx.fillRect(-p.s/2, -p.s/3, p.s, p.s*0.66);
      ctx.restore();
    }
    if(parts.length){ rafId = requestAnimationFrame(tick); }
    else { ctx.clearRect(0,0,canvas.width,canvas.height); rafId = null; }
  }

  var musicBtn = document.getElementById('musicBtn');
  var AC = window.AudioContext || window.webkitAudioContext;
  var actx = null, playing = false, timer = null;
  var scale = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25, 587.33, 659.25];
  function ensureCtx(){ if(!actx && AC) actx = new AC(); return actx; }
  function playNote(){
    var c = ensureCtx(); if(!c) return;
    if(c.state === 'suspended') c.resume();
    var f = scale[(Math.random()*scale.length)|0];
    var o = c.createOscillator(), g = c.createGain();
    o.type = 'sine'; o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, c.currentTime);
    g.gain.exponentialRampToValueAtTime(0.12, c.currentTime + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + 1.4);
    o.connect(g); g.connect(c.destination);
    o.start(); o.stop(c.currentTime + 1.5);
  }
  function schedule(){
    if(!playing) return;
    playNote();
    timer = setTimeout(schedule, 700 + Math.random()*500);
  }
  musicBtn.addEventListener('click', function(){
    var c = ensureCtx(); if(!c) return;
    if(c.state === 'suspended') c.resume();
    playing = !playing;
    musicBtn.classList.toggle('on', playing);
    if(playing){ schedule(); }
    else { if(timer) clearTimeout(timer); }
  });
})();
</script>
</body>
</html>
